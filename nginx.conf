server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  auth_basic "HORAS CONCEPT — Accès restreint";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /health {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
